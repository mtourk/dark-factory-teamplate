next_eligible_item_rationale: >
  UPDATED 2026-10-05 (second update this day): FF-P04-01 (app shell) is implemented (85/85 tests
  passing), making FF-P05-01 (New Idea page) dependency-unblocked and the prior pick — see history
  below. Re-picked FF-P01-01 ahead of it, same day, because the user is now standing up a
  cross-machine dev workflow (macOS/Cursor for development, this Windows laptop for local-Ollama
  test/deploy) and FF-P01-01 was just re-prioritized high->critical after confirming (direct grep)
  that factory/context/broker.py, factory/state.py, factory/implementation/workspace.py,
  factory/sealed_qa/acceptance.py, and factory/tools/worktrees.py hardcode 'C:\Factory'-style
  paths. Per the master plan's own priority-first selection rule (§0 step 6), a critical-priority
  unblocked item (FF-P01-01, dependencies: []) now outranks a high-priority one (FF-P05-01).
  Fixing this first reduces the risk that Mac-authored work (which cannot test on Windows/Ollama)
  silently depends on path assumptions it never saw break. FF-P05-01 remains the next item after
  FF-P01-01 lands. See docs/operations/CROSS_MACHINE_DEV_WORKFLOW.md for the full workflow this
  decision supports.
previous_next_eligible_item_rationale: >
  2026-10-05 (first update): FF-P04-01 (app shell) is now implemented (85/85 tests passing in
  factory/tests/test_intake_web_shell.py, plus the underlying 41/41 Node-driver checks),
  built per D-NEW-001 Option A by extending factory/intake/web/app.js in place with a
  hash-based Router, AppShellState, showPage()/createModal() focus management, and
  matching responsive index.html/style.css — see implementation-status.yml:FF-P04-01.
  FF-P05-01 (New Idea page / idea-intake) is now the first unblocked item: its only
  dependency, FF-P04-01, is implemented, and it has no blocker_id. FF-P06-01 and
  FF-P13-02/17-01/18-01 are also now dependency-unblocked by FF-P04-01, but FF-P06-01
  remains gated by FB-02 and FF-P17-01 by FB-08, so they are not yet eligible to start.
  In parallel, FF-P07-01 (BMAD engine) remains unblocked by FF-P03-01 and has its decision
  made (D-NEW-004, Option A, local-Ollama-routed) — still gated by FB-04 (no real engine
