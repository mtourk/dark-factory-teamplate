next_eligible_item_rationale: >
  UPDATED 2026-10-05 (API-first migration): the user approved the API-First Multi-Provider LLM
  migration plan (see repo-root "Full API-First Multi-Provider Architecture..." md and
  decisions.yml:D-NEW-005, which supersedes D-NEW-004's local-only mandate). FF-P21-01 (durable
  Run/Stage persistence + FB-12) and FF-P21-02 (checkpoint/agent-run/llm-request models + resume/
  status CLI) are both verified_complete — the state foundation is in place. FF-P22-01 (the
  provider-agnostic LLM gateway over the LiteLLM Python SDK, wiring the dead gateway= seam and
  replacing builder.py's direct Ollama call — which also resolves FB-02) is the next unblocked item;
  it depends only on FF-P21-01. It adds `litellm` to pyproject.toml and creates the factory/llm/
  package. The pre-API-first queue below (FF-P01-01 etc.) is paused but not discarded — several items
  (FF-P03/04/05) remain valid product-plane work and will be re-sequenced once the LLM layer lands.
