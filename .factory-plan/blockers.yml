blockers:
  - id: FB-01
    title: "Leaked, unrotated Cloudflare API token committed to git history"
    severity: critical
    category: security
    status: open
    discovered_in: "docs audit (CREATE_ROUTE_API.md)"
    evidence:
      - "docs/CREATE_ROUTE_API.md, committed at 10fd1ce, contains a live-looking Cloudflare API token in plaintext"
    blocks:
      - FF-P03-02
    impact: >
      Any Cloudflare account-level action (DNS, Worker deploy, D1, KV, R2 provisioning per §10)
      is at risk until this token is confirmed revoked/rotated. Secret-store-reference discipline
      (§3.4, §14) cannot be claimed as satisfied while a raw secret sits in git history.
    remediation:
      - "Rotate the token in the Cloudflare dashboard immediately (independent of any code change)."
      - "Scrub docs/CREATE_ROUTE_API.md of the literal token value (git history rewrite is optional/out of scope; rotation makes the leaked value worthless)."
      - "Replace all remaining plaintext-secret references in docs/ with secret-store-reference placeholders per §3.4."
    owner: "human (requires Cloudflare dashboard access — not an agent-executable step)"
    opened_at: "2026-10-05"
    closed_at: null

  - id: FB-02
    title: "Gemini used as primary reasoning/BMAD-answering engine in text-chat fallback"
    severity: critical
    category: architecture-violation
    status: open
    discovered_in: "factory/intake/worker/src/gemini.ts audit"
    evidence:
      - "factory/intake/worker/src/gemini.ts:216-284 getDiscoveryResponseFromGemini() calls Gemini to generate the next BMAD question/response"
      - "factory/intake/worker/src/gemini.ts:301-321 getDiscoverySystemPrompt() instructs Gemini to act as the discovery AI"
      - "This path activates whenever local Ollama inference times out (524), which per docs/operations/INTAKE_DEPLOYMENT_PLAYBOOK.md is the common case on the current hardware"
    blocks:
      - FF-P06-01
    impact: >
      Direct, currently-realized violation of §4.2 (Gemini voice boundary: transcription + TTS
      only) and critical mistake #3 (Gemini must never answer BMAD questions). Every discovery
      conversation routed through this fallback has had its requirements effectively authored by
      Gemini, not by the local BMAD engine — a correctness and provenance problem for every issue
      filed through intake while this path is live, not just a future risk.
    remediation:
      - "Delete getDiscoveryResponseFromGemini()/getDiscoverySystemPrompt() reasoning path entirely; Gemini integration must be reduced to Live API transcription + TTS per §4."
      - "Replace the Ollama-timeout fallback with: (a) a queued retry, or (b) surfacing a clear 'local model busy' state to the user — never a cloud-LLM substitution."
      - "Add a CI/lint check (or code-review gate) that flags any new call from worker code into a Gemini text-generation endpoint outside src/gemini.ts's token-minting function."
    owner: "agent (code change) — no external approval needed beyond normal review"
    opened_at: "2026-10-05"
    closed_at: null

  - id: FB-03
    title: "No authentication exists anywhere in the intake worker or web UI"
    severity: critical
    category: security
    status: open
    discovered_in: "factory/intake/worker/src/index.ts audit"
    evidence:
      - "factory/intake/worker/src/index.ts:80-104 route dispatcher has zero auth checks on any route"
      - "factory/intake/worker/src/index.ts Env interface (35-45) has no auth binding (no session secret, no identity provider config)"
      - "factory/intake/web has no login screen, no session/cookie handling, no CSRF token anywhere in app.js"
    blocks:
      - FF-P04-01
      - FF-P07-01
      - FF-P09-01
      - FF-P09-02
    impact: >
      §3.3 requires portal auth before any BMAD/repo-selection/decision flow is reachable; §14
      requires CSRF + rate-limiting. Currently the entire intake surface is open to anyone who can
      reach the Worker URL — including the GitHub-repo-creation and (once built) Cloudflare
      resource-provisioning actions, which are account-mutating. This is the single highest-impact
      blocker: nearly every Phase 04-18 item is gated behind it.
    remediation:
      - "Resolve decisions.yml:D-NEW-002 (auth model choice) first — this blocker cannot be worked until that decision is made."
      - "Implement chosen auth (session cookie + CSRF token, or Cloudflare Access) across every mutating route in index.ts."
      - "Add rate-limiting middleware (Cloudflare native rate-limiting rules, or a KV-backed token bucket) to intake endpoints."
    owner: "agent, pending human decision on D-NEW-002"
    opened_at: "2026-10-05"
    closed_at: null
    progress_note: >
      2026-10-05: D-NEW-002 decided Option A (Cloudflare Access). FF-P03-01 implemented
      Cloudflare Access JWT verification gating the 5 mutating routes listed in
      implementation-status.yml:FF-P03-01 (status: implemented_unverified, 11/11 tests
      passing). Still open because: (1) the Cloudflare Access Application itself has not
      been created in the dashboard yet (CLOUDFLARE_ACCESS_AUD/TEAM_DOMAIN in wrangler.toml
      are placeholders), (2) gemini-token and pending-profiles routes remain unauthenticated
      (out of this phase's explicit scope), and (3) rate-limiting middleware is still not
      implemented.

  - id: FB-04
    title: "BMAD engine location/design not decided — real engine does not exist"
    severity: critical
    category: design-gap
    status: open
    discovered_in: "factory/analysis/bmad.py audit"
    evidence:
      - "factory/analysis/bmad.py:110-206 discover_from_issue() is pure heuristic string-parsing of an already-filed GitHub issue — not an interactive one-question-at-a-time engine"
      - "factory/analysis/bmad.py:100-108 self.gateway is accepted in __init__ but never called anywhere in the class"
      - "No code anywhere implements §5.1-5.4's one-question-at-a-time protocol, numbered-options-plus-free-text format, or the mandatory delegated-assumption option"
    blocks:
      - FF-P07-01
    impact: >
      This is the structural heart of the product (§1's 'BMAD conversation UI', §5 in full) and it
      does not exist in working form. FF-P07-01 cannot move past not_started until a design
      decision is made: run BMAD inference in the Cloudflare Worker (near the UI, via a hosted
      small model or Workers AI) vs. route every BMAD turn back to the local Ollama gateway over
      the existing tunnel (reusing factory/analysis/bmad.py's gateway hook, finally wiring it up).
    remediation:
      - "Record the location decision in decisions.yml (new decision id, e.g. D-NEW-004) before writing code."
      - "If local-Ollama-routed: wire bmad.py's unused self.gateway to a real model call implementing the one-question protocol; replace discover_from_issue()'s heuristics with it."
      - "If Worker-hosted: design a new module in factory/intake/worker/src/ implementing the same protocol, and retire bmad.py's role to local-only fallback/dev-testing."
      - "Either way: implement the mandatory 'use your best judgment and assumptions, stop asking' delegated option and live draft update (ties to FF-P08-01)."
    owner: "human decision + agent implementation"
    opened_at: "2026-10-05"
    closed_at: null

