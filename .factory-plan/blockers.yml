  - id: FB-09
    title: "ContextBroker.assemble_role_context() raises ContextPolicyViolation for every role — broker is non-functional"
    severity: high
    category: correctness-bug
    status: resolved
    discovered_in: "FB-07 remediation agent (factory/implementation/builder.py fix), confirmed by direct invocation of ContextBroker"
    evidence:
      - "factory/context/broker.py: manifest_id built as f'pkg-{run_id}-{role.value}' but ContextManifest.manifest_id requires pattern ^manifest-[a-z0-9-]{16}$ — FIXED: now f'manifest-{sha256(run_id:role.value)[:16]}'"
      - "factory/context/broker.py:_compute_source_artifacts hardcoded source_phase=0, SourceArtifact.source_phase requires ge=1 — FIXED: source_phase=1 (explicitly-commented placeholder; no caller threads a real phase number through to the broker today)"
      - "factory/context/broker.py:assemble_role_context validated ContextManifest(**manifest_dict) with manifest_hash='' BEFORE computing the real hash — FIXED: hash computed first via existing _compute_manifest_hash, manifest constructed/validated exactly once (removed the old redundant double-construction)"
      - "RESOLVED 2026-10-05, commit 1dd7c6dd (fix(context-broker): resolve FB-09 — manifest_id pattern, source_phase, and hash-before-validate ordering bugs in assemble_role_context()). models.py was NOT touched — the bugs were entirely in broker.py's usage, not overly-strict schemas."
      - "New factory/tests/test_context_broker.py (15 tests), independently re-run 2026-10-05: 15/15 passing — parametrized over every FactoryRole, asserts assemble_role_context() returns a ContextPackage (not an exception) for each, plus a store/load round-trip test. factory/tests/test_context_isolation_builder.py + test_phase10_implementation.py (34 tests) re-confirmed passing — no regressions."
      - "Confirmed independently: factory/tests/test_phase5_leakage.py's 19 failures (not 12 as originally estimated — corrected count) are byte-for-byte unchanged before/after this fix (git-stash A/B) AND are not testing the old broken behavior — see new blocker FB-11 for the real, separate cause."
    blocks: []
    impact: >
      RESOLVED. ContextBroker.assemble_role_context() now succeeds for every role given a
      correctly-formatted run_id. factory/implementation/builder.py's call (wired in by FB-07) will
      now actually receive compiled_intent/approved_plan instead of always hitting its
      except-ContextPolicyViolation fail-closed branch.
    remediation:
      - "✅ COMPLETED: all three bugs fixed in broker.py only; 15 new regression tests added, 34 existing tests re-confirmed passing, no regressions anywhere in the suite (verified via git-stash A/B against the full test_phase5_leakage.py / test_phase6-8 / test_schemas_phase2 failure counts, all unchanged)."
