  - id: FB-06
    title: "No Cloudflare resource/DNS provisioning capability exists anywhere in the codebase"
    severity: high
    category: missing-capability
    status: open
    discovered_in: "factory/deploy/cloudflare_adapter.py audit"
    evidence:
      - "factory/deploy/cloudflare_adapter.py:160-178 build_wrangler_command() only targets an already-existing wrangler project; it has no create-D1/create-KV/create-R2/create-DNS-record logic"
      - "docs/operations/CLOUDFLARE_DNS_AUTOMATION.md is pseudocode/design-only, never implemented"
      - "docs/decisions/ADR-007.md defines the 'one hostname -> one resource' rule as approved but unbuilt"
    blocks:
      - FF-P10-01
    impact: >
      §10's entire resource-provisioning requirement (idempotent Worker/D1/KV/R2/DNS creation with
      app-name.mtourk.com collision-suffix naming) has zero implementation. New-repo-driven builds
      (§9's 'new repo' path) cannot reach a deployed, DNS-addressable state without this.
    remediation:
      - "Implement a CloudflareProvisioner module following ADR-007's one-hostname-one-resource rule, using the Cloudflare API (not just wrangler CLI) for idempotent create-or-get semantics on Worker/D1/KV/R2/DNS."
      - "Implement the app-name.mtourk.com collision-suffix naming scheme and record every created resource in the project_resources D1 table (§7)."
      - "Add a dry-run mode that reports what would be created without mutating the account, for safe testing."
    owner: "agent"
    opened_at: "2026-10-05"
    closed_at: null

  - id: FB-07
    title: "builder.py feeds raw discovery conversation into code-gen prompt, bypassing ContextBroker"
    severity: critical
    category: architecture-violation
    status: open
    discovered_in: "factory/implementation/builder.py audit"
    evidence:
      - "factory/implementation/builder.py:44 BuilderInput.raw_conversation field"
      - "factory/implementation/builder.py:490-495 _build_user_prompt() appends every raw discovery Q&A message directly into the builder's prompt"
      - "factory/context/broker.py's isolation/exclusion logic (196-311) is never called from builder.py (confirmed by grep across factory/implementation/)"
    blocks:
      - FF-P12-02
    impact: >
      Directly violates §11 (context isolation) and critical mistake #10 (no raw conversation/
      private-memory sharing between roles). The builder role currently receives the full,
      unfiltered discovery transcript — including anything a user said that the per-role exclusion
      list (ContextBroker._compute_exclusions, broker.py:291-311) is specifically designed to keep
      out of the builder's context.
    remediation:
      - "Remove BuilderInput.raw_conversation entirely; replace its use in _build_user_prompt() with a ContextBroker.assemble_role_context() call scoped to the builder role."
      - "Add a regression test asserting the builder's assembled prompt never contains the literal discovery-conversation message text, only the derived requirements/acceptance-criteria artifacts ContextBroker is designed to pass through."
      - "Wire ContextBroker into the orchestrator's call path generally (currently unreferenced outside its own test file) so this isolation is enforced structurally, not just at this one call site."
    owner: "agent"
    opened_at: "2026-10-05"
    closed_at: null

  - id: FB-08
    title: "Autonomous deploys blocked by environment permission classifier; human must run Wrangler/Pages steps manually"
    severity: high
    category: environment-constraint
    status: open
    discovered_in: "docs/operations/INTAKE_DEPLOYMENT_PLAYBOOK.md audit"
    evidence:
      - "docs/operations/INTAKE_DEPLOYMENT_PLAYBOOK.md documents that Pages/Worker/D1-migration deploy steps are currently blocked for autonomous execution by a permission classifier and must be run by a human"
      - "factory/deploy/target_repo_setup.py:60-107 configure_github_secrets() only prints gh secret set commands for manual execution (_provide_user_instructions, 109-133) rather than running them"
    blocks:
      - FF-P16-01
      - FF-P17-01
    impact: >
      §15's fully-autonomous delivery workflow (step culminating in production deploy) cannot
      complete end-to-end without a human in the loop at the deploy step, contradicting the
      product vision's autonomy goal for this stage. This is an environment/tooling constraint,
      not a code defect.
    remediation:
      - "Determine the exact permission boundary causing the block (likely: no stored Cloudflare API token with deploy scope available to the agent's execution environment) and whether a scoped, human-approved credential can be issued to the automation identity."
      - "Until resolved: keep the explicit human handoff step in the workflow (as target_repo_setup.py already does for secrets) rather than attempting to silently bypass it — this is intentional friction (§19 critical mistake #16, no admin bypass), not a bug to route around."
      - "Document this as an accepted, human-gated step in the Definition of Done (§20) rather than claiming full autonomy prematurely."
    owner: "human (environment/credential policy decision)"
    opened_at: "2026-10-05"
    closed_at: null
