# .factory-plan/implementation-status.yml
#
# Machine-readable source of truth for resumability (New_FEATURE_FACTORY_MASTER_PLAN.md §0.1).
# Every item follows the exact schema given in §0.1. Statuses are restricted to the five values
# defined in §0: not_started | partially_implemented | implemented_unverified | verified_complete | blocked.
#
# This file was generated by a Phase 00 audit (New_FEATURE_FACTORY_MASTER_PLAN.md Phase 00 /
# New_FEATURE_FACTORY_EXECUTION_PROMPT.md §1-§2) performed on 2026-10-05 by four parallel
# read-only exploration passes over:
#   - factory/intake/web, factory/intake/worker, factory/intake/*.py, docs/operations/*
#   - factory/monitor/web, PHASE_17_0_*.md
#   - factory/analysis/*.py, factory/context/broker.py, factory/review/independent.py,
#     factory/sealed_qa/*, factory/implementation/*, factory/github_integration/*,
#     factory/deploy/*, factory/backlog/*, factory/tools/*, factory/schemas/*, factory/state.py
#   - DARK_FACTORY_MASTER_PLAN.md, IMPLEMENTATION_CHECKLIST.md, docs/decisions/*, docs/threat-model.md,
#     docs/audit/*, git log
#
# No item below is marked verified_complete solely because a similarly named file exists, per §0.5.
# Items are marked verified_complete only where automated tests exist AND pass AND were independently
# confirmed in this or an earlier session (cited by test file path).
#
# last_updated_by follows the convention: "<agent-name>:<session-date>"

