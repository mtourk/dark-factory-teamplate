- id: FF-P04-01
  phase: app-shell
  title: Responsive application shell (hash router, UI state, keyboard/focus a11y) extending the existing vanilla-JS frontend in place, per D-NEW-001
  status: implemented
  priority: high
  dependencies: [FF-P03-01]
  repository_paths:
    - factory/intake/web/index.html
    - factory/intake/web/app.js
    - factory/intake/web/style.css
    - factory/intake/README.md
    - factory/tests/test_intake_web_shell.py
    - factory/tests/helpers/app_shell_driver.mjs
  existing_evidence:
    - "D-NEW-001 (decisions.yml, status: decided, chosen_option: A) selected extending factory/intake/web's vanilla JS in place over a framework rebuild; this item implements that decision rather than the stale 'React/Vite/TS + shadcn/Tailwind' framing previously recorded here."
    - "app.js: new Router IIFE module (register/navigate/start/resolve/getCurrentRoute/normalizeHash/setNotFound) implementing hash-based routing (#/, #/conversation, #/success, #/history, #/settings) with a notFound fallback to '/'."
    - "app.js: new AppShellState IIFE module persisting only {activeRoute} to a new, isolated localStorage key (dfactory_ui_state) — verified never to read/write the pre-existing dfactory_session_id/dfactory_draft keys."
    - "app.js: showPage(name) is the single page-visibility switch (toggles .hidden across hero/chat/success/history/settings sections, sets aria-current=page on the matching nav link, and calls .focus() on the shown section for route-change focus announcement)."
    - "app.js: createModal(modalEl, getFocusables) is a reusable focus-trap factory used by both help-modal and repo-modal — Escape closes + restores focus to the trigger button; Tab/Shift+Tab cycle and wrap within the modal."
    - "index.html: added skip link, #app-nav primary nav (4 links), tabindex=-1 + aria-labelledby on all page sections, and two new placeholder pages (#history-section for FF-P05-01, #settings-section) that start hidden."
