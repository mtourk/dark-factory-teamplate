  # ---- New decisions required by the new plan ----
  - id: D-NEW-001
    title: "Frontend stack for factory/intake/web: extend existing vanilla JS, or rebuild on a framework?"
    status: decided
    chosen_option: "A"
    chosen_option_text: "Extend vanilla JS in place: keep vanilla JS, add a minimal hash-router and small state store by hand. Lowest migration risk, consistent with 'migration not rewrite' principle."
    context: >
      §1 describes a materially richer Cloud Product UI than exists today: portal with auth,
      BMAD conversation UI with live draft, queue/monitoring/decision pages, voice UI. The current
      factory/intake/web is plain HTML/CSS/vanilla JS with no router and no component model
      (confirmed by audit: index.html/app.js/style.css/version.js, no framework present).
    options:
      - "A. Extend in place: keep vanilla JS, add a minimal hash-router and small state store by hand. Lowest migration risk, consistent with 'migration not rewrite' principle, but will get harder to maintain as page count grows (hero/chat/success/repo-modal/help-modal -> +portal/+queue/+monitor/+decision)."
      - "B. Introduce a lightweight framework (e.g. Preact or Svelte, no build-step-heavy React/Next) scoped to new pages only, leaving existing pages as-is until touched."
      - "C. Full rebuild on a standard SPA framework now, before adding any new page."
    recommendation: >
      Option A for the current phase (FF-P04-01), re-evaluate at Phase 09+ if page count/state
      complexity make hand-rolled routing unmanageable. This matches the master plan's own
      migration-not-rewrite framing and avoids blocking Phase 04 on a framework-selection debate.
    decided_by: "Mohammad Tourk (user:2026-10-05)"
    decided_at: "2026-10-05T00:00:00Z"
    blocks: [FF-P04-01]

  - id: D-NEW-002
    title: "Authentication model for the intake portal"
    status: decided
    chosen_option: "A"
    chosen_option_text: "Cloudflare Access (zero-trust) in front of the Worker/Pages: no custom auth code, policy-based, ties identity to Cloudflare's own IdP/email-OTP, simple immediate implementation."
    context: >
      FB-03: zero authentication exists anywhere in factory/intake/worker or factory/intake/web.
      §3.3 requires auth before BMAD/repo-selection/decision flows are reachable; §14 requires
      CSRF + rate-limiting. This decision gates FF-P03-01, which in turn gates nearly every
      cloud-facing phase (04-18). User explicitly chose Option A "for now, simple" per session 2026-10-05.
    options:
      - "A. Cloudflare Access (zero-trust) in front of the Worker/Pages: no custom auth code, policy-based, but ties identity to Cloudflare's own IdP/email-OTP and is coarser-grained than a per-user D1 users table."
      - "B. Custom session-cookie auth backed by the D1 users table (§7), with a lightweight password or magic-link flow implemented in the Worker: more code, but matches the D1 data model's users/user_profiles entities directly and gives finer-grained per-user state."
      - "C. Hybrid: Cloudflare Access for coarse perimeter auth, D1 users table for application-level profile/preference state keyed off the Access-verified identity."
    recommendation: >
      (Agent's original recommendation was C. User chose A "for now, simple.") Option A unblocks
      FF-P03-01 immediately without custom auth infrastructure. Can be upgraded to Option C in a
      later phase if fine-grained per-user state becomes needed.
    decided_by: "Mohammad Tourk (user:2026-10-05)"
    decided_at: "2026-10-05T00:00:00Z"
    blocks: [FF-P03-01, FF-P04-01, FF-P07-01, FF-P09-01, FF-P09-02]

  - id: D-NEW-003
    title: "Cloud-side secrets model: reconcile ADR-003/005/006 local-secret handling with §3.4's D1 integration_secret_refs"
    status: decided
    chosen_option: "A"
    chosen_option_text: "Cloudflare Workers Secrets (wrangler secret put) for every cloud-side integration credential, with integration_secret_refs in D1 storing only the secret's logical name/binding, never its value."
    context: >
      §3.4 requires the Cloud Product Plane to store only *references* to secrets (never raw
      values) in the integration_secret_refs D1 table, with masking everywhere in UI/logs. Prior
      ADRs cover local-environment secret hygiene (factory/deploy/cloudflare_adapter.py's
      assert_adapter_holds_no_secret()/redact_for_logging(), confirmed real at lines 66-88) but
      nothing yet defines where the actual secret *values* live for cloud-side integrations
      (GitHub PAT, Cloudflare API token, Gemini API key) — a secrets manager, Cloudflare
      Workers Secrets, or an external vault.
    options:
      - "A. Cloudflare Workers Secrets (wrangler secret put) for every cloud-side integration credential, with integration_secret_refs in D1 storing only the secret's logical name/binding, never its value."
      - "B. External secrets manager (e.g. a vault service) with D1 storing a reference key; adds an external dependency but centralizes rotation/audit across both planes."
    recommendation: >
      Option A — Workers Secrets is already the natural fit for a Workers-based backend, requires
      no new external dependency, and is consistent with ADR-003's local-secret-hygiene precedent
      extended to the cloud side. Revisit only if a future requirement needs cross-service secret
      sharing beyond what Workers Secrets supports.
    decided_by: "Mohammad Tourk (user:2026-10-05)"
    decided_at: "2026-10-05T00:00:00Z"
    blocks: [FF-P03-02]

  - id: D-NEW-004
    title: "BMAD engine execution location: Worker-hosted vs. local-Ollama-routed"
    status: decided
    chosen_option: "A"
    chosen_option_text: "Local-Ollama-routed: the Worker proxies each BMAD turn over the existing tunnel to the local Ollama gateway, reusing/activating factory/analysis/bmad.py's self.gateway hook, paired with fixing FB-02's timeout handling (queued retry or explicit busy state, never Gemini substitution)."
    context: >
      FB-04: no real BMAD one-question-at-a-time engine exists. factory/analysis/bmad.py has an
      unused gateway hook; the Worker has no BMAD module at all. This decision must be made before
      FF-P07-01 can start. Also, Gemini is currently being used as the fallback reasoning engine
      on Ollama timeout (FB-02, which must be removed).
    options:
      - "A. Local-Ollama-routed: the Worker proxies each BMAD turn over the existing tunnel to the local Ollama gateway, reusing/activating factory/analysis/bmad.py's self.gateway hook. Keeps all reasoning on the fixed local hardware (§2), consistent with 'Ollama-only, cloud fallback prohibited' — but reintroduces the same latency/524-timeout risk that originally motivated the Gemini-fallback violation (FB-02), so the timeout-handling redesign in FB-02's remediation must land first or alongside this."
      - "B. Worker-hosted via Cloudflare Workers AI or another in-Worker small model: removes the tunnel dependency and its latency/timeout risk entirely, but moves BMAD reasoning off the fixed local-only hardware §2 mandates for the Local Factory Plane, which may conflict with 'Ollama-only' intent if that intent is read to cover BMAD specifically (not just code-gen)."
    recommendation: >
      Option A, paired with fixing FB-02's timeout handling (queued retry / explicit busy-state,
      never a cloud-LLM substitution) rather than reaching for Option B's cloud model as a
      workaround. §2's 'Ollama-only, cloud fallback prohibited' reads as a whole-system constraint,
      not one scoped only to code generation, so Option B should only be chosen if the user
      confirms that reading is wrong.
    decided_by: "Mohammad Tourk (user:2026-10-05)"
    decided_at: "2026-10-05T00:00:00Z"
    blocks: [FF-P07-01]
    related: [FB-02, FB-04]
    superseded_by: >
      D-NEW-005 (partial). The "Ollama-only, cloud fallback prohibited / never Gemini substitution"
      premise is reversed by the API-first migration: cloud providers become the normal path and BMAD
      (like every agent) calls the provider-agnostic LLM gateway. The *mechanism* of D-NEW-004 Option A
      (route a turn to the local Ollama gateway) survives as one provider the router may select; what
      changes is that it is no longer the mandated/only engine and cloud routing is no longer a violation.

  - id: D-NEW-005
    title: "API-First Multi-Provider LLM architecture (supersedes D-NEW-004's local-only mandate)"
    status: decided
    chosen_option: "A"
    chosen_option_text: >
      Full API-first: cloud LLM APIs become the normal execution path; the local Ollama model is
      demoted to an optional provider/fallback. All agents call a provider-agnostic LLM gateway
      (factory/llm/, built on the LiteLLM Python SDK in-process) and never name a provider. A
      custom Free-Tier Intelligence layer (quota state + confidence + failure learning) sits above
      the gateway; a capability+quota-aware router selects provider/model/key. Default cost policy
      is FREE_ONLY with automatic fallback to local Ollama when free capacity is exhausted (no paid
      spend without explicit opt-in).
    context: >
      The project was designed local-Ollama-first (ADR-001/002, §2, D-NEW-004), but the fixed
      hardware (HP EliteBook, Core Ultra 7, 32 GB RAM, Intel Arc) cannot make local inference the
      quality/latency/concurrency foundation an autonomous factory needs. The user approved the
      repo-root plan "Full API-First Multi-Provider Architecture, Free-Tier Intelligence, Context
      Management & Agent Continuity Plan.md", which mandates an API-first, multi-provider, multi-key,
      free-tier/quota/failure/context/memory-aware, resumable architecture, with local kept as a
      fallback. See the approved implementation plan for the full component/phase/data-model design.
    decisions_locked:
      direction: "Full API-first; local Ollama = optional provider/fallback."
      gateway: "LiteLLM Python SDK, in-process (no separate service, no Postgres/Redis)."
      free_exhausted: "Auto-fallback to local Ollama (FREE_ONLY default; no silent paid spend)."
      scope: "Full phased plan, built incrementally, as the FF-P2x backlog track."
      providers_now: "Google Gemini only (key exists); near-term value = multi-key + local fallback; arch ready for Groq/OpenRouter/Mistral/Cohere/Z AI via the catalog importer."
      concurrency: "1 active run for now; quota reservation designed concurrency-safe."
      privacy: "No gating; always-on secret redaction, per-profile local_only override available."
    consequences: >
      Resolves FB-02 (Gemini-as-reasoning is no longer a violation once routed through the governed
      gateway; the ad-hoc timeout substitution in gemini.ts is replaced by the router). Supersedes
      D-NEW-004's cloud-fallback-prohibition. ADR-005 (voice ephemeral-token boundary) and D-NEW-003
      (secrets as refs) still hold. New FF-P2x track added to backlog.yml. Several pre-API-first
      product-plane items (FF-P03/04/05) remain valid and will be re-sequenced after the LLM layer.
    decided_by: "Mohammad Tourk (user:2026-10-05)"
    decided_at: "2026-10-05T00:00:00Z"
    blocks: [FF-P22-01, FF-P22-02, FF-P24-01, FF-P25-01]
    related: [D-NEW-004, FB-02, ADR-001, ADR-002]

  - id: D-NEW-006
    title: "Release 1 runtime: cloud-only via OmniRoute; defer local LLM fallback"
    status: decided
    chosen_option: "A"
    chosen_option_text: "Use the existing external OmniRoute gateway for all Release 1 model calls; allow policy-controlled cloud-to-cloud failover only; pause/resume durably when no eligible cloud route remains; defer local Ollama until after Release 1."
    context: >
      The project owner confirmed on 2026-10-11 that local LLM was intended as fallback, not primary. To reduce initial complexity and remove laptop/Tunnel dependencies, Release 1 starts without local inference while preserving the ability to add it later. The existing API-first plan's in-process LiteLLM and automatic local fallback instructions conflict with the intended OmniRoute-based cloud deployment.
    decisions_locked:
      release_1_runtime: "Cloud-only; no local Ollama, local laptop, or Cloudflare Tunnel dependency."
      gateway: "Existing external OmniRoute service; treat it as a dependency, do not modify its repository."
      routing: "Provider-neutral Factory adapter; cloud-to-cloud failover only when configured and permitted."
      cost_policy: "FREE_ONLY by default; no silent paid usage. If no eligible route remains, persist and pause/retry the run."
      local_llm: "Deferred optional provider; not implemented or required for Release 1."
      monitoring: "Observe Factory-originated cloud model calls, retries, outcomes, latency, and redacted visible prompt/response data; never store private chain-of-thought."
      hosting: "Cloudflare for portal/API/D1; Oracle VM is a candidate for always-on services after read-only deployment audit."
    consequences: >
      This narrows D-NEW-005's Release 1 implementation: use OmniRoute instead of adding an in-process LiteLLM gateway and custom quota-intelligence layer before need is demonstrated. It supersedes D-NEW-004's local-only execution and defers D-NEW-005's local fallback. The long-term provider-neutral API-first direction remains. No DNS, Tunnel, VM provisioning, schema migration, or production deployment is authorized by this documentation decision.
    decided_by: "Project owner (conversation confirmation, 2026-10-11)"
    decided_at: "2026-10-11"
    blocks: [FF-P00-03, FF-P07-01, FF-P12-02, FF-P17-01]
    related: [D-NEW-004, D-NEW-005, ADR-008]

