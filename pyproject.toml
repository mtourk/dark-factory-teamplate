[project]
name = "factory"
version = "0.1.0"
description = "Dark Factory: Windows-native autonomous delivery, API-first multi-provider LLM with local fallback (FactoryFlow orchestrator)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Dark Factory Contributors" }
]

dependencies = [
    # CLI. Typer >= 0.15 (and its modern bundled click) is required for
    # compatibility with litellm's transitive deps — huggingface-hub needs
    # click >= 8.4.2, which the old typer 0.9.0 (click < 8.2) conflicted with.
    "typer>=0.15,<1",
    "rich>=13,<15",            # used directly (factory/cli.py); previously via typer[all]
    # In-process multi-provider LLM gateway (D-NEW-005 / FF-P22-01).
    "litellm>=1.55,<2",
    # Relaxed from == pins because litellm requires newer pydantic/httpx/jinja2.
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "sqlalchemy==2.0.23",
    "jinja2>=3.1,<4",
    "pyyaml==6.0.1",
    "httpx>=0.25,<0.29",
    "requests==2.31.0",
    "aiofiles==23.2.1",
    "opentelemetry-api==1.20.0",
    "opentelemetry-sdk==1.20.0",
    "opentelemetry-exporter-otlp==0.41b0",
    "python-dotenv==1.0.0",
    # NOTE: aider-chat==0.35.1 removed — never imported in factory/, and its
    # old pins (pydantic<2 era) block installing litellm.
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "black==23.12.0",
    "ruff==0.1.8",
    "mypy==1.7.1",
]

[project.scripts]
factory = "factory.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
